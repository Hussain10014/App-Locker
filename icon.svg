<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#cyanGlow)" stroke-width="8" stroke-dasharray="16 16" opacity="0.4" />
  <!-- Padlock Shackle -->
  <path d="M 180 230 V 165 C 180 120 215 85 256 85 C 297 85 332 120 332 165 V 230" fill="none" stroke="url(#cyanGlow)" stroke-width="32" stroke-linecap="round" />
  <!-- Padlock Body -->
  <rect x="140" y="210" width="232" height="190" rx="36" fill="#1e293b" stroke="url(#cyanGlow)" stroke-width="12" filter="url(#glow)" />
  <!-- Keyhole -->
  <circle cx="256" cy="290" r="22" fill="url(#cyanGlow)" />
  <path d="M 246 295 L 240 345 H 272 L 266 295 Z" fill="url(#cyanGlow)" />
</svg>
