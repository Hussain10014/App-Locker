name: Build ZenLock Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub web interface

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Copy Assets to Android App
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html style.css app.js manifest.json icon.svg android/app/src/main/assets/

      - name: Grant execute permission for gradlew
        run: |
          cd android
          chmod +x gradlew || true

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenLock-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
